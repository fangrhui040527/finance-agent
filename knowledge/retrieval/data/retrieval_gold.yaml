# REMOVED 2026-09-12: `- query: 1155.MY`, a lexical question on the Bursa ticker
# in Malaysian local form. Every one of the four documents in the corpus carrying
# that token was a `$MAYBANK (1155.MY)$` ticker tag from www.moomoo.com - a bare
# tag, "Keep it up", and two copies of a "FREE RM188" promotion. `indexable()`
# now drops titles that OPEN with such a tag (they name a company and assert
# nothing about it), so the question has no reachable answer and would score a
# permanent zero on every leg.
#
# Deleted rather than kept-and-counted, which is the opposite of the call made
# for 'regulators stopped short of breaking up an advertising business'. That one
# stays because its answer exists and is real - four GDELT rows on a genuine
# story the index filter cannot reach, so the zero measures a gap worth closing.
# This one's answers were spam. A question whose only correct answers are spam
# measures the spam, not the search.
#
# If a real document ever carries `1155.MY` - a broker note, an exchange filing -
# the question is worth restoring, and this note is here so the next person knows
# it existed and why it went.

