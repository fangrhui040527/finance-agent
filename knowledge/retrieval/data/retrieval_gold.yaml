- query: SPCX
  kind: lexical
  note: >-
    A ticker whose whole corpus is labelled, not a sample. The note used to read
    "appears nowhere else"; the 2026-09-09 us_close sweep collected a fourth
    document carrying the token and the completeness guard named it, which is
    what that guard is for. For a lexical question the criterion is containment,
    so a new document carrying the token is a correct retrieval and belongs here
    - leaving it out would have shown up as a search regression in the exact-token
    MRR rather than as corpus growth.

    It happened a second time, larger, on the 2026-09-15 sweeps: FOUR more
    documents carrying the token arrived at once, and main went red on the guard
    before any code change touched retrieval. Same response, same reason. A
    lexical question on a ticker that is having a news week is the most expensive
    kind of label to keep complete, and that cost is the guard working rather
    than a reason to loosen it.

    A third time on the 2026-09-15 us_close sweep, which committed after those
    four were labelled: one more document, and main was red again by 2026-09-17
    for every branch opened against it. TEN labels now. Three times in nine days
    is the rate this label actually costs, and it is worth writing down: the
    guard is doing its job on a schedule set by SPCX's news flow, not by anything
    in this repository.

    A fourth time on the 2026-09-18 us_close sweep: one SeekingAlpha document,
    labelled on 2026-09-19 when PR #76 went red on it. ELEVEN labels. Four
    relabels in eleven days is the rate; a follow-up worth weighing is deriving
    a lexical question's relevant set from containment at evaluation time, since
    containment is the criterion this note keeps restating, and keeping the
    hand list as documentation rather than as the truth the guard defends.

    A fifth, hours later, on the 2026-09-19 us_close sweep: a Stocktwits market
    wrap with the ticker in its title, labelled while the same pull request was
    still open. TWELVE labels.

    A sixth on the 2026-09-20 us_close sweep, a Sunday: one Finnhub headline on
    the same Nvidia-in-orbit story the ticker has been carrying all week,
    labelled the same evening, on the same pull request. THIRTEEN labels. Six
    relabels in twelve days, three of them on consecutive sweeps, is the
    measured cost of keeping this list by hand; the containment follow-up above
    is the fix.

    A seventh on the 2026-09-21 us_close sweep: a futures wrap that lists the
    ticker among seven in its title. FOURTEEN labels. Four consecutive sweeps
    have each added one; the list is now maintained nightly as a chore, which
    is the strongest argument yet for deriving a lexical question's relevant
    set from containment at evaluation time.
