# Labelled retrieval questions - the gold set `knowledge/retrieval/evaluate.py` scores against.
#
# created_by: human (written 2026-09-07, drawn from data/corpus.db as it stood
# that day; the labels were picked by reading the candidate articles, not by
# running the retriever, so the set does not reward the thing it measures).
#
# Two families, on purpose:
#
#   semantic  the question is deliberately worded in DIFFERENT words from the
#             article that answers it - "bendable handset" for "foldable
#             iPhone", "insider" for "substantial shareholder". Exact-token
#             search cannot answer these. This is the family a vector leg
#             exists for, and the family that says whether it works.
#   lexical   a ticker, a product name, a filed figure. BM25 must own these,
#             and a change that improves the semantic family at their expense
#             has not improved search - it has moved the failure.
#
# `relevant` means something different in each family, and conflating them is
# what broke this set once already.
#
#   semantic  EVERY article verified to answer the question, and not every
#             article that could: the corpus has more, an unlabelled hit scores
#             as a miss, so read recall as a FLOOR and the comparison between
#             legs as the finding.
#   lexical   EVERY document carrying the query's tokens, without exception.
#             The criterion is containment, so each one is a correct retrieval
#             and ranking any of them first is correct. Label a subset and the
#             score turns on an arbitrary tie-break: on 2026-09-07 a second post
#             carrying `1155.MY` arrived, scored identically to the labelled
#             one, took rank 1, and dropped lexical MRR from 1.000 to 0.938 with
#             nothing about the search having changed. `ask.py retrieval` now
#             names an unlabelled document that carries every token of a lexical
#             question, so the next one is a line of output and not a mystery.
#
# Titles are recorded beside each id so a label that ages out of the corpus can
# be named rather than silently lowering the score.
#
# A label can now be unreachable for two DIFFERENT reasons, and `ask.py
# retrieval` reports them separately because the fixes are opposite:
#
#   missing       gone from data/corpus.db. The corpus moved; re-collect, or
#                 relabel against what is there now.
#   unindexable   still in the corpus, kept out of the INDEX by `indexable()` -
#                 a headline-only row naming no instrument. Re-collecting it
#                 changes nothing. Only the filter or the label can move.
#
# The second category did not exist until the index filter shipped, and the
# report went on calling it the first - which sends a reader to the corpus to
# look for a row the corpus still has.
#
# KNOWN UNANSWERABLE, and deliberately kept rather than deleted: 'regulators
# stopped short of breaking up an advertising business'. Every one of the four
# articles this corpus holds on that story is a GDELT headline-only row naming
# no instrument, so all four are filtered and the question has no reachable
# answer. Deleting it would raise the score by hiding a real coverage gap: this
# system cannot retrieve that story at all. It stays, named on every run, until
# GDELT carries bodies or another source covers the story.
