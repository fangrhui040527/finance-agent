  "XNAS:NVDA": {subsector: Semiconductors,       valid_from: 2020-01-01}
  "XNAS:AMD":  {subsector: Semiconductors,       valid_from: 2020-01-01}
  "XNAS:INTC": {subsector: Semiconductors,       valid_from: 2020-01-01}
