  "MYX:5183":  {subsector: Chemicals,            valid_from: 2020-01-01}
  "MYX:3816":  {subsector: Marine Transport,     valid_from: 2020-01-01}
  "MYX:4197":  {subsector: Conglomerates,        valid_from: 2020-01-01}
  "MYX:5225":  {subsector: Hospitals,            valid_from: 2020-01-01}
  "MYX:8869":  {subsector: Aluminium,            valid_from: 2020-01-01}
