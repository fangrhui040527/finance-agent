  # --- 2026-09-06: peers for the seven book names that had none ------------------
  #
  # `ask.py graph --peers` returned nothing for Tenaga, Petronas Chemicals, IHH,
  # Press Metal, Genting, Apple and Microsoft, which left `peer_set`, the
  # workup's competitive step and the comps half of `ask.py valuation` empty for
  # seven of the nine names in the book. Each row below is a rivalry that is
  # widely stated and that a person can check in an hour; none is verified
  # against a primary document in this repository yet, so each carries no
  # `verified:` and reads as curated.
  #
  # Press Metal is deliberately absent: no other primary aluminium smelter is
  # listed on Bursa, and an invented peer is worse than the honest refusal
  # `peers_of` already prints. Its `exposed_to` aluminium edge below carries
  # what can be said about it.

  - id: tenaga-ytlpower-compete
