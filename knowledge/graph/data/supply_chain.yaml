# Curated relationships. The only place a SUPPLIES / CUSTOMER_OF /
# COMPETES_WITH / EXPOSED_TO edge comes from in the deterministic tier.
#
# THIS FILE IS THE SOURCE DOCUMENT, and that is deliberate rather than a
# shortcut. An edge here is EXTRACTED because a person wrote it down and vouches
# for it, and `note` records the basis they vouched on. The alternative - minting
# a plausible-looking filing id the corpus cannot produce - would be a fabricated
# citation, and path_to_citations would refuse the path anyway.
#
# So: every row cites `curated:supply_chain#<id>`, and the graph never claims a
# filing said something a filing did not say.
#
# BEFORE YOU TRADE ON ANY OF THIS: these are seed examples chosen because they
# are widely known, not because they were verified against a primary source in
# this repository. Delete any row you cannot stand behind. An unverified edge
# that survives here is exactly the failure this system exists to prevent.
#
# HOW TO VERIFY A ROW. Add `verified:` naming the primary document that states
# the relationship - a filing accession, an annual-report section, a regulator's
# register:
#
#   verified: "edgar:0000320193-25-000106#item1-competition"
#
# The edge then cites THAT document instead of this file, so every reader - the
# peer set, the workup's competitive step, path_to_citations - stops saying
# "a person wrote this down" and starts saying what the document says. A row
# without it still works and is still citable; it simply reads as what it is.
#
# HUMAN-AUTHORED. kb_supply_chain is created_by: human in agents/registry.yaml,
# so no agent may ever write here.
#
# A relationship that ends is CLOSED with valid_to, never deleted - the store
# refuses the delete, and history has to stay answerable.

