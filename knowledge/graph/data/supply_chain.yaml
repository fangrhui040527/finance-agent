    target: "MYX:6742"
    relation: competes_with
    weight: 0.7
    valid_from: 2020-01-01
    note: >-
      Both generate and sell power in Malaysia; YTL Power is an independent
      power producer selling into the same grid Tenaga operates. Weaker than a
      like-for-like rivalry because Tenaga also owns the transmission network,
      which YTL Power does not compete for.

