# Temporary: diagnose the Alpha Vantage key (2026-10-29). Removed in the next
# commit. Runs only when this file is pushed; prints no key, only its shape and
# Alpha Vantage's answers with the key scrubbed. Spends 6 of the day's 25 calls.
name: av-key-diagnose

on:
  push:
    branches: [claude/new-session-3rm9vv]
    paths: [.github/workflows/av-key-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        env:
          NAMED: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALL_SECRET: ${{ secrets.ALL_SECRET }}
        run: |
          BLOB=$(python3 .github/scripts/keys_from_blob.py ALL_SECRET --only ALPHAVANTAGE_API_KEY 2>/dev/null | sed -n 's/^ALPHAVANTAGE_API_KEY=//p')
          export BLOB
          unset ALL_SECRET
          python3 - <<'EOF'
          import hashlib, json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          def shape(name, k):
              if not k:
                  print(f"{name}: not set"); return
              s = k.strip()
              print(f"{name}: length {len(k)}, stripped {len(s)}, "
                    f"whitespace at ends {k != s}, alphanumeric {s.isalnum()}, "
                    f"upper-case only {s.isupper()}, sha256[:8] {hashlib.sha256(s.encode()).hexdigest()[:8]}")

          named, blob = os.environ.get("NAMED", ""), os.environ.get("BLOB", "")
          shape("ALPHAVANTAGE_API_KEY (named secret)", named)
          shape("ALPHAVANTAGE_API_KEY (inside ALL_SECRET)", blob)
          key = (named or blob).strip()
          if not key:
              raise SystemExit("no key")

          today = datetime.now(timezone.utc).strftime("%Y%m%dT0000")
          calls = [
              ("free endpoint: GLOBAL_QUOTE IBM", {"function": "GLOBAL_QUOTE", "symbol": "IBM"}),
              ("free endpoint: SYMBOL_SEARCH tesco", {"function": "SYMBOL_SEARCH", "keywords": "tesco"}),
              ("NEWS_SENTIMENT AAPL limit 5", {"function": "NEWS_SENTIMENT", "tickers": "AAPL", "limit": "5"}),
              ("NEWS_SENTIMENT topics technology limit 5", {"function": "NEWS_SENTIMENT", "topics": "technology", "limit": "5"}),
              ("NEWS_SENTIMENT AAPL limit 50", {"function": "NEWS_SENTIMENT", "tickers": "AAPL", "limit": "50"}),
              ("NEWS_SENTIMENT AAPL, the collector's exact shape", {"function": "NEWS_SENTIMENT", "tickers": "AAPL",
                  "time_from": today, "limit": "200", "sort": "LATEST"}),
          ]
          for label, params in calls:
              time.sleep(2.5)  # free tier: 1 request per second at most
              url = "https://www.alphavantage.co/query?" + urllib.parse.urlencode({**params, "apikey": key})
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      status, body = r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n== {label}: request failed: {type(e).__name__}: {str(e).replace(key, '***')}")
                  continue
              body = body.replace(key, "***")
              try:
                  data = json.loads(body)
              except ValueError:
                  print(f"\n== {label}: HTTP {status}, not JSON: {body[:200]!r}"); continue
              notice = {k: v for k, v in data.items() if k in ("Information", "Note", "Error Message")}
              if notice:
                  verdict = "REFUSED/NOTICE: " + " | ".join(f"{k}: {str(v)[:260]}" for k, v in notice.items())
              elif "feed" in data:
                  feed = data["feed"]
                  verdict = f"OK: items {data.get('items')}, feed {len(feed)} articles"
                  if feed:
                      a = feed[0]
                      verdict += f"; first: {a.get('time_published')} {a.get('title','')[:80]!r}"
              else:
                  verdict = f"OK: keys {list(data)[:6]}"
              print(f"\n== {label}: HTTP {status}\n   {verdict}")
          EOF
