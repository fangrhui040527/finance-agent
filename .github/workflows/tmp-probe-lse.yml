# TEMPORARY (2026-11-03): second look at londonstrategicedge.com's API - the
# documentation, guide and terms pages load as separate script files; read
# them for the documented endpoints, limits and terms. The owner's own key
# (LSE_API_KEY) is sent, never printed. Removed after its run.
name: tmp-probe-lse
on:
  push:
    branches: [claude/new-session-3rm9vv]
    paths: [.github/workflows/tmp-probe-lse.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Documentation, guides and terms
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        shell: python
        run: |
          import html, json, os, re, urllib.request, urllib.error
          KEY = os.environ.get("LSE_API_KEY", "").strip()
          UA = "finplanet-analyst-mind/0.1 (personal research)"
          def get(url, accept="*/*", key=False, n=8_000_000):
              h = {"User-Agent": UA, "Accept": accept}
              if key: h["x-api-key"] = KEY
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30)
                  return r.status, r.read(n).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(4000).decode("utf-8", "replace")
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"
          s, b = get("https://data-api.londonstrategicedge.com/", accept="application/json", key=True)
          print("data-api root:", s, b[:500])
          s, page = get("https://londonstrategicedge.com/data/documentation", accept="text/html")
          entry = re.findall(r'src="(/assets/[^"]+\.js)"', page)[0]
          s, js = get("https://londonstrategicedge.com" + entry)
          chunks = sorted(set(re.findall(r'["\'`](?:\./|/assets/|assets/)([A-Za-z0-9_\-]+\.js)["\'`]', js)))
          print("chunks named in the entry:", len(chunks))
          want = [c for c in chunks if re.search(r'(?i)doc|guide|term|legal|api|databank|data|python|stream|pricing|plan|limit', c)]
          print("reading:", want[:40])
          for c in want[:40]:
              s, t = get("https://londonstrategicedge.com/assets/" + c)
              hits = []
              for word in ("curl", "data-api.londonstrategicedge.com", "api.londonstrategicedge.com", "x-api-key", "X-API-Key", "requests per", "per hour", "per minute", "rate limit", "Rate limit", "redistribut", "commercial", "licen", "attribution", "Malaysia", "Bursa", "KLSE", "economic_calendar", "macro", "options", "/v1/"):
                  for m in list(re.finditer(re.escape(word), t))[:3]:
                      hits.append((word, m.start()))
              if not hits: continue
              print("=" * 90); print(c, s, len(t))
              shown = []
              for word, i in sorted(hits, key=lambda x: x[1]):
                  if any(abs(i - j) < 400 for j in shown): continue
                  shown.append(i)
                  frag = re.sub(r"\s+", " ", html.unescape(t[max(0, i - 250): i + 450]))
                  print(f"  [{word}] {frag}")
                  if len(shown) >= 14: break
