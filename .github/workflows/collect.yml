# The collector. `ask.py sweep --slot <slot>` pulls every enabled source that
# runs in that slot, stores articles in data/corpus.db and figures, events,
# series and documents in data/facts.db, links articles into data/graph.db,
# writes the day's digest, and records the attempt - success or failure - in
# the sweeps and pulls tables.
#
# It runs HERE rather than on the dev machine for one reason: news expires.
# The GDELT window is recent-only, and free-tier quotas are per day, so a day
# nothing collects is a day that cannot be fetched later. A laptop collects
# nothing while it is closed; this does not. It also runs here because the
# development environment has no route to any data host at all.
#
# FOUR SLOTS, each timed to when its sources have something new
# (knowledge/sources/catalog.py is the register):
#
#   bursa_close   09:20 UTC = 17:20 MYT, after Bursa's 17:00 close. Daily,
#                 weekends included - Malaysian business press publishes on
#                 Sunday, and a daily cadence keeps the sweep-silence monitor
#                 (30h) honest.
#   us_preopen    12:30 UTC = 08:30 ET, weekdays. FRED's overnight prints, the
#                 earnings calendar, rating changes.
#   us_close      21:15 UTC = 17:15 ET, daily. US company news, insider and
#                 SEC filings, the day's sentiment.
#   weekly        Sunday 02:00 UTC. Statements, estimates, transcripts, CPI.
#
# COST. About four to six linux minutes a run, roughly twenty runs a week -
# some 450 minutes a month against a 3,000-minute allowance. Windows never
# runs here; there is nothing OS-specific about fetching JSON.
name: collect

on:
  schedule:
    - cron: "20 9 * * *"     # bursa_close
    - cron: "30 12 * * 1-5"  # us_preopen
    - cron: "15 21 * * *"    # us_close
    - cron: "0 2 * * 0"      # weekly
  # A job you cannot fire by hand is a job you cannot recover - and how a new
  # source gets its first real run.
  workflow_dispatch:
    inputs:
      slot:
        description: "which moment of the day this is"
        type: choice
        options: [all, bursa_close, us_preopen, us_close, weekly]
        default: all

# The sweep COMMITS what it collected. ci.yml is contents: read; this one
# cannot be.
permissions:
  contents: write

# Two sweeps at once would race on the same commit. They would not corrupt the
# stores - every insert is INSERT OR IGNORE and the database decides - but the
# push would conflict and one run's evidence would be lost.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # SWEEP_DEADLINE_SECONDS stops new requests at 10 minutes so the run always
    # reaches the commit step; a job killed by this cap commits nothing at all.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The schedule string is the only thing that says which cron fired.
      - name: Which slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "20 9 * * *")    slot=bursa_close ;;
            "30 12 * * 1-5") slot=us_preopen ;;
            "15 21 * * *")   slot=us_close ;;
            "0 2 * * 0")     slot=weekly ;;
            *)               slot="${{ inputs.slot || 'all' }}" ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "running slot: $slot"

      # Exit codes are the sweep's interface, so read them instead of
      # flattening them with `|| true`:
      #   0  every enabled source read (a source without a key is SKIPPED, not failed)
      #   2  the sweep could not run at all - bad config, unknown slot
      #   3  at least one source failed or came back degraded; recorded in the stores
      #
      # 3 still commits. A failed sweep that leaves no trace is indistinguishable
      # from a quiet day. The job is still marked failed afterwards so a person
      # looks.
      # An operator who keeps every key in one repository secret named
      # ALL_SECRET has done something reasonable that these workflows did not
      # expect. .github/scripts/keys_from_blob.py finds each key in it by label
      # or by shape; this step masks and exports what it found. A secret set
      # under its own name always wins over the blob's copy.
      - name: Keys from ALL_SECRET, when the named secrets are not set
        env:
          ALL_SECRET: ${{ secrets.ALL_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$ALL_SECRET" ]; then
            echo "ALL_SECRET is not set; the named secrets are in use"
            exit 0
          fi
          python3 .github/scripts/keys_from_blob.py ALL_SECRET | while IFS='=' read -r name value; do
            if [ -n "${!name}" ]; then
              echo "$name: set under its own name; the blob's copy is ignored"
              continue
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name: taken from ALL_SECRET"
          done

      - name: Sweep
        id: sweep
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || env.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || env.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY || env.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || env.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GDELT_USER_AGENT: ${{ secrets.GDELT_USER_AGENT }}
        run: |
          set +e
          uv run python ask.py sweep --slot "${{ steps.slot.outputs.slot }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Its own step. A news source being throttled says nothing about whether
      # the central bank published a rate. Bursa-close and manual runs only:
      # BNM publishes once a day, after the Kuala Lumpur session.
      - name: Record the official FX rate
        id: fx
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'all'
        run: |
          set +e
          uv run python ask.py fx
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The day's bars for every name and each market's proxy, into
      # data/price_cache.db. The nightly feedback routine decomposes moves from
      # this cache (FINPLANET_OFFLINE=1) because the session it runs in has no
      # route to a price host. Close slots and manual runs only.
      - name: Cache the day's prices
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'us_close' || steps.slot.outputs.slot == 'all'
        run: |
          set +e
          uv run python ask.py prices --book
          exit 0

      # The paper book (docs/22): apply whatever was decided at the first
      # cached bar after the decision, mark both books at today's closes, raise
      # stops, grade the predictions whose date has come. Runs from the cache
      # just written, so it needs no network of its own. A marking fault must
      # never cost the sweep its commit - it is printed and the job goes on.
      - name: Mark the paper book
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'us_close' || steps.slot.outputs.slot == 'all'
        env:
          FINPLANET_OFFLINE: "1"
        run: |
          set +e
          uv run python ask.py paper mark --slot "${{ steps.slot.outputs.slot }}"
          uv run python ask.py paper grade
          exit 0

      # The day's digest: per name, what was collected, what escalated, what
      # moved in the series. Written for the agents and for the person - and
      # for the nightly feedback routine, which reads it rather than the raw
      # tables.
      - name: Write the digest
        run: |
          set +e
          uv run python ask.py digest --write
          exit 0

      - name: What the stores hold now
        run: |
          uv run python -c "
          from knowledge.corpus import Corpus
          from knowledge.facts import FactBook
          with Corpus() as c:
              print('corpus', c.counts())
          with FactBook() as f:
              print('facts ', f.counts())
          "

      - name: Commit what was collected
        if: steps.sweep.outputs.code == '0' || steps.sweep.outputs.code == '3'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One at a time, skipping any that is not there: `git add` on a
          # missing path is fatal, and one store missing must never cost the
          # others their day.
          for path in data/corpus.db data/graph.db data/fx.db data/facts.db data/price_cache.db data/digests data/paper.db data/learning.db knowledge/paper; do
            if [ -e "$path" ]; then
              git add "$path"
            else
              echo "no $path yet - skipping it"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          # [skip ci]: a data commit; ten test jobs to validate a row of news is waste.
          git commit -m "chore(corpus): the $(date -u +%Y-%m-%d) ${{ steps.slot.outputs.slot }} sweep [skip ci]"
          # Another slot may have pushed while this one ran; rebase our one
          # data commit onto it rather than fail the push.
          # --autostash: the sweep leaves stores it did not stage (a cache file)
          # modified in the tree, and a rebase refuses to start over them.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      # Exit 3 is "a source was degraded": part of the day was collected and
      # committed, and the sweep said which names and why. That is a warning
      # on the run, not a failed job - a job that is red every day GDELT
      # times out on one name trains the operator to ignore red, which is
      # the one thing this signal must never do. `ask.py watch` reads the
      # sweeps and pulls tables for the same fact. Exit 2 (could not run) and
      # an fx failure stay failures: nothing was collected, or the rate is
      # missing.
      - name: Warn if a source was degraded
        if: steps.sweep.outputs.code == '3'
        run: |
          echo "::warning title=sweep degraded::a source failed or was degraded; see the sweeps table in data/corpus.db and the pulls table in data/facts.db, or the summary above"

      - name: Fail if the sweep could not run
        if: (steps.sweep.outputs.code != '0' && steps.sweep.outputs.code != '3') || (steps.fx.outcome != 'skipped' && steps.fx.outputs.code != '0')
        run: |
          echo "sweep exited ${{ steps.sweep.outputs.code }}, fx exited ${{ steps.fx.outputs.code || 'n/a' }}"
          echo "  2 = could not run (config, slot or adapter)"
          exit 1
