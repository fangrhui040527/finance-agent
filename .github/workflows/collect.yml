# The collector. `ask.py sweep --slot <slot>` pulls every enabled source that
# runs in that slot, stores articles in data/corpus.db and figures, events,
# series and documents in data/facts.db, links articles into data/graph.db,
# writes the day's digest, and records the attempt - success or failure - in
# the sweeps and pulls tables.
#
# GitHub warns on a file over 50 MiB and refuses a push with one over 100 MiB,
# and data/corpus.db grows about half a megabyte a day. So the commit step also
# writes the corpus as fixed 16 MiB parts (data/stores/corpus/, `ask.py stores
# split`), which no amount of collection makes larger; for now the whole file
# is committed beside them, until the parts have been shown to reassemble it on
# real runs. The size check in that step unstages any store at 95 MiB, so the
# rest of a run's collection still lands, and a run that cannot push leaves its
# commit on a rescue/ branch instead of on a runner that is thrown away.
#
# It runs HERE rather than on the dev machine for one reason: news expires.
# The GDELT window is recent-only, and free-tier quotas are per day, so a day
# nothing collects is a day that cannot be fetched later. A laptop collects
# nothing while it is closed; this does not. It also runs here because the
# development environment has no route to any data host at all.
#
# FOUR SLOTS, each timed to when its sources have something new
# (knowledge/sources/catalog.py is the register):
#
#   bursa_close   09:20 UTC = 17:20 MYT, after Bursa's 17:00 close. Daily,
#                 weekends included - Malaysian business press publishes on
#                 Sunday, and a daily cadence keeps the sweep-silence monitor
#                 (30h) honest.
#   us_preopen    12:30 UTC = 08:30 ET, weekdays. FRED's overnight prints, the
#                 earnings calendar, rating changes.
#   us_close      21:15 UTC = 17:15 ET, daily. US company news, insider and
#                 SEC filings, the day's sentiment.
#   weekly        Sunday 02:00 UTC. Statements, estimates, transcripts, CPI.
#
# COST. About four to six linux minutes a run, roughly twenty runs a week -
# some 450 minutes a month against a 3,000-minute allowance. Windows never
# runs here; there is nothing OS-specific about fetching JSON.
name: collect

on:
  schedule:
    - cron: "20 9 * * *"     # bursa_close
    - cron: "30 12 * * 1-5"  # us_preopen
    - cron: "15 21 * * *"    # us_close
    - cron: "0 2 * * 0"      # weekly
  # A job you cannot fire by hand is a job you cannot recover - and how a new
  # source gets its first real run.
  workflow_dispatch:
    inputs:
      slot:
        description: "which moment of the day this is"
        type: choice
        options: [all, bursa_close, us_preopen, us_close, weekly]
        default: all
      # A named slot collects once per firing; the second arrival is a no-op
      # (knowledge/sweep.py). This is the person's override for the case the
      # guard cannot know about - a run that collected the wrong thing, or a
      # source repaired since the slot ran - and it is never set by the cron.
      force:
        description: "collect even if this slot's firing already ran"
        type: boolean
        default: false
      evidence_retry:
        description: "web evidence: moves to search once more although already searched, by key (MYX:3182|2026-10-26), comma-separated; never past two paid tries"
        type: string
        default: ""

# The sweep COMMITS what it collected. ci.yml is contents: read; this one
# cannot be.
permissions:
  contents: write

# Two sweeps at once would race on the same commit. They would not corrupt the
# stores - every insert is INSERT OR IGNORE and the database decides - but the
# push would conflict and one run's evidence would be lost.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # SWEEP_DEADLINE_SECONDS stops new requests at 10 minutes so the run always
    # reaches the commit step; a job killed by this cap commits nothing at all.
    # The price step has its own budget and cap for the same reason (below),
    # and so does the web evidence step. This cap must be at least the sum of
    # those bounds - setup ~1, sweep 10 plus requests in flight ~1, prices 8,
    # web evidence 11, digest, monitor and commit ~2 - or it can cancel the
    # job while the evidence step waits on a search it has already paid for,
    # and the commit that records that spend never runs.
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      # The branch as it stands when this run starts, not the commit the event
      # carried. The concurrency group queues a run behind the one in flight,
      # and without `ref` a queued run checks out the SHA from when it was
      # triggered: on 2026-09-23 the bursa_close run dispatched three seconds
      # after us_close started from dc6e822, collected, and could not commit,
      # because us_close had pushed new copies of the same binary stores in
      # between and SQLite files do not merge. A cron run queued behind a
      # dispatch hits the same wall. (The group holds one waiting run; a third
      # arrival cancels the waiting one, and `sweep --due` recovers its slot.)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The schedule string is the only thing that says which cron fired.
      - name: Which slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "20 9 * * *")    slot=bursa_close ;;
            "30 12 * * 1-5") slot=us_preopen ;;
            "15 21 * * *")   slot=us_close ;;
            "0 2 * * 0")     slot=weekly ;;
            *)               slot="${{ inputs.slot || 'all' }}" ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "running slot: $slot"

      # Exit codes are the sweep's interface, so read them instead of
      # flattening them with `|| true`:
      #   0  every enabled source read (a source without a key is SKIPPED, not failed)
      #   2  the sweep could not run at all - bad config, unknown slot
      #   3  at least one source failed or came back degraded; recorded in the stores
      #
      # 3 still commits. A failed sweep that leaves no trace is indistinguishable
      # from a quiet day. The job is still marked failed afterwards so a person
      # looks.
      # An operator who keeps every key in one repository secret named
      # ALL_SECRET has done something reasonable that these workflows did not
      # expect. .github/scripts/keys_from_blob.py finds each key in it by label
      # or by shape; this step masks and exports what it found. A secret set
      # under its own name always wins over the blob's copy.
      - name: Keys from ALL_SECRET, when the named secrets are not set
        env:
          ALL_SECRET: ${{ secrets.ALL_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$ALL_SECRET" ]; then
            echo "ALL_SECRET is not set; the named secrets are in use"
            exit 0
          fi
          python3 .github/scripts/keys_from_blob.py ALL_SECRET | while IFS='=' read -r name value; do
            # Exported here, a key reaches every later step's processes. The
            # Anthropic key is read from the blob by the web evidence step
            # itself, so it reaches that step alone.
            if [ "$name" = "ANTHROPIC_API_KEY" ]; then
              echo "$name: found; read by the web evidence step alone"
              continue
            fi
            if [ -n "${!name}" ]; then
              echo "$name: set under its own name; the blob's copy is ignored"
              continue
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name: taken from ALL_SECRET"
          done

      - name: Sweep
        id: sweep
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || env.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || env.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY || env.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || env.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || env.EODHD_API_KEY }}
          # Which EODHD plan the key is on (free | fundamentals | all-in-one).
          # Not a secret, but kept beside the key it describes; absent means
          # the free plan and its two-names-a-day rotation. See .env.example.
          EODHD_PLAN: ${{ secrets.EODHD_PLAN || 'free' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Should carry a real contact e-mail: GDELT throttles by address, and
          # GitHub's runners share addresses. See .env.example.
          GDELT_USER_AGENT: ${{ secrets.GDELT_USER_AGENT }}
        run: |
          set +e
          uv run python ask.py sweep --slot "${{ steps.slot.outputs.slot }}" ${{ inputs.force && '--force' || '' }}
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Its own step. A news source being throttled says nothing about whether
      # the central bank published a rate. Bursa-close and manual runs only:
      # BNM publishes once a day, after the Kuala Lumpur session.
      - name: Record the official FX rate
        id: fx
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'all'
        run: |
          set +e
          uv run python ask.py fx
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The day's bars for every name and each market's proxy, into
      # data/price_cache.db. The nightly feedback routine decomposes moves from
      # this cache (FINPLANET_OFFLINE=1) because the session it runs in has no
      # route to a price host. Close slots and manual runs only.
      #
      # This step and the two after it stay NON-FATAL - a price host down must
      # not cost the sweep its commit - but non-fatal is not silent. Each one
      # writes a ::warning:: annotation when it exits non-zero, so a failure
      # shows on the run's summary page instead of in a log nobody opens.
      #
      # It also has a time limit of its own, because on 2026-09-29 it took
      # 15m16s of the job's 25. `prices --book` stops starting fetches after
      # PRICES_BUDGET_SECONDS (4 minutes) and lists what it did not reach, and
      # each request is bounded by its feed's timeout; the step cap below is
      # the backstop for a request that trickles past both, and
      # continue-on-error lets the job go on to the commit if it is hit.
      - name: Cache the day's prices
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'us_close' || steps.slot.outputs.slot == 'all'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set +e
          uv run python ask.py prices --book
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=prices not cached::ask.py prices --book exited $code; today's bars may be missing from data/price_cache.db, and the paper mark and the nightly decomposition read from it"
          fi
          exit 0

      # The paper book (docs/22): apply whatever was decided at the first
      # cached bar after the decision, mark both books at today's closes, raise
      # stops, grade the predictions whose date has come. Runs from the cache
      # just written, so it needs no network of its own. A marking fault must
      # never cost the sweep its commit - it is printed, annotated, and the job
      # goes on.
      - name: Mark the paper book
        if: steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'us_close' || steps.slot.outputs.slot == 'all'
        env:
          FINPLANET_OFFLINE: "1"
        run: |
          set +e
          uv run python ask.py paper mark --slot "${{ steps.slot.outputs.slot }}"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=paper book not marked::ask.py paper mark exited $code; today's marks are missing from data/paper.db"
          fi
          uv run python ask.py paper grade
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=predictions not graded::ask.py paper grade exited $code"
          fi
          exit 0

      # Web evidence (knowledge/evidence/web.py): for a book name whose
      # session moved beyond 1.96 sigma with the decomposition saying a
      # company-specific cause is warranted, ask Claude with web search what
      # explains it, and keep each page it cites as a corpus row. After the
      # price cache and the marks, because the trigger is measured from the
      # bars just cached; before the digest and the commit, so its rows are
      # committed with the sweep. A session is searched once it has been shut
      # for 6 hours, so a Bursa day is searched at that day's us_close and a
      # US day at the next bursa_close. Every attempt and its cost is a row
      # in the corpus, which is also the month's spend record, checked against
      # config.toml [budget] before each search. The key goes to this step
      # only - from its own secret, or read here from ALL_SECRET, which is
      # then dropped before anything runs. The run starts no search leg that
      # cannot finish inside DEADLINE_SECONDS (8 min, knowledge/evidence/
      # web.py); the limit below is that plus startup, so a billed search is
      # never killed before it is recorded. Non-fatal like its neighbours: no
      # key, no move, a refused search or an API fault costs this step, never
      # the commit.
      - name: Search the web for unexplained moves
        if: (steps.slot.outputs.slot == 'bursa_close' || steps.slot.outputs.slot == 'us_close' || steps.slot.outputs.slot == 'all') && (steps.sweep.outputs.code == '0' || steps.sweep.outputs.code == '3')
        timeout-minutes: 11
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALL_SECRET: ${{ secrets.ALL_SECRET }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # An input reaches the script as data in the environment, never
          # pasted into it: the shell does not parse what an operator typed.
          EVIDENCE_RETRY: ${{ inputs.evidence_retry }}
          FINPLANET_OFFLINE: "1"
        run: |
          set +e
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$ALL_SECRET" ]; then
            ANTHROPIC_API_KEY=$(python3 .github/scripts/keys_from_blob.py ALL_SECRET --only ANTHROPIC_API_KEY 2>/dev/null | sed -n 's/^ANTHROPIC_API_KEY=//p')
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "::add-mask::$ANTHROPIC_API_KEY"
              echo "ANTHROPIC_API_KEY: taken from ALL_SECRET"
            fi
            export ANTHROPIC_API_KEY
          fi
          unset ALL_SECRET
          uv run python ask.py evidence --retry "${EVIDENCE_RETRY:-}"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=web evidence not searched::ask.py evidence exited $code; see the step log"
          fi
          exit 0

      # The day's digest: per name, what was collected, what escalated, what
      # moved in the series. Written for the agents and for the person - and
      # for the nightly feedback routine, which reads it rather than the raw
      # tables.
      - name: Write the digest
        run: |
          set +e
          uv run python ask.py digest --write
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=digest not written::ask.py digest --write exited $code; the nightly routine will find no page for today"
          fi
          exit 0

      # The monitor, here, so data/alerts.db is committed beside the stores it
      # judged. NEW means "first seen" only if the log it is diffed against is
      # the last run's, and until this step nothing that commits ever ran
      # `watch`: the nightly routine runs it in a fresh clone and commits only
      # its pages, so every night started from an alerts.db whose newest event
      # is from 2026-09-23, and an unchanged price_stale was announced NEW for
      # weeks. Last of the
      # writers, so it reads the sweep, the price cache, the paper marks and
      # the digest this run will push. Offline: it reads the stores and asks no
      # host. Exit 1 only says something is open - that is the report, not a
      # fault - so only 2, the check itself failing, is annotated.
      #
      # Only when the commit step below will run, on the same condition: a
      # monitor whose log is thrown away with the run would only make the next
      # one diff against an older state. And a watch that exits 2 may have
      # recorded some rules and not others (each event commits on its own), so
      # its partial log is put back to the committed one rather than becoming
      # the next run's baseline.
      - name: Run the monitor
        if: steps.sweep.outputs.code == '0' || steps.sweep.outputs.code == '3'
        env:
          FINPLANET_OFFLINE: "1"
        run: |
          set +e
          uv run python ask.py watch
          code=$?
          if [ "$code" -eq 2 ]; then
            git checkout -- data/alerts.db 2>/dev/null || true
            echo "::warning title=monitor did not run::ask.py watch exited 2; its partial data/alerts.db was put back, so the next watch diffs against the last complete run"
          fi
          exit 0

      - name: What the stores hold now
        run: |
          uv run python -c "
          from knowledge.corpus import Corpus
          from knowledge.facts import FactBook
          with Corpus() as c:
              print('corpus', c.counts())
          with FactBook() as f:
              print('facts ', f.counts())
          "

      - name: Commit what was collected
        id: commit
        if: steps.sweep.outputs.code == '0' || steps.sweep.outputs.code == '3'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The corpus as parts (knowledge/stores.py). It refuses - and writes
          # nothing - rather than publish a corpus with fewer rows than the last
          # one, a WAL it could not checkpoint, or parts that do not concatenate
          # back to the file. A refusal costs this run its parts, not the rest
          # of its collection; the job is failed at the end so it is seen.
          split_failed=0
          if ! uv run python ask.py stores split; then
            git checkout -- data/stores 2>/dev/null || true
            git clean -fdq -- data/stores 2>/dev/null || true
            split_failed=1
            echo "::error title=corpus not split::ask.py stores split refused; data/stores was put back and the rest of the collection is committed without it"
          fi
          echo "split_failed=$split_failed" >> "$GITHUB_OUTPUT"
          # One at a time, skipping any that is not there: `git add` on a
          # missing path is fatal, and one store missing must never cost the
          # others their day.
          for path in data/corpus.db data/graph.db data/stores data/fx.db data/facts.db data/price_cache.db data/digests data/paper.db data/learning.db data/alerts.db knowledge/paper; do
            if [ -e "$path" ]; then
              git add "$path"
            else
              echo "no $path yet - skipping it"
            fi
          done
          # GitHub refuses a whole push over one file of 100 MiB, so a store at
          # 95 MiB is unstaged and named: the other stores still land. 45 MiB
          # is a warning, months ahead at today's growth. A part never reaches
          # either; this is for the stores that are still whole files.
          too_big=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -ge 99614720 ]; then
              git reset -q -- "$f"
              too_big=1
              echo "::error title=store too large to push::$f is $size bytes; GitHub refuses files over 100 MiB, so it was left out of this commit. See docs/14-OPERATIONS-RUNBOOK.md, Large stores."
            elif [ "$size" -ge 47185920 ]; then
              echo "::warning title=store nearing GitHub's limit::$f is $size bytes; GitHub warns at 50 MiB and refuses 100 MiB. See docs/14-OPERATIONS-RUNBOOK.md, Large stores."
            fi
          done < <(git diff --cached --name-only -z)
          echo "too_big=$too_big" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          # [skip ci]: a data commit; ten test jobs to validate a row of news is waste.
          git commit -m "chore(corpus): the $(date -u +%Y-%m-%d) ${{ steps.slot.outputs.slot }} sweep [skip ci]"
          ours="$(git rev-parse HEAD)"
          # From here on, any way out of this step but a push lands the commit
          # on a rescue/ branch first: the runner is thrown away with
          # everything on it. A failing fetch or reset exits the step under
          # `bash -e` as surely as the give-up below, so a trap covers both,
          # and a cancellation or the job's time limit (SIGINT, SIGTERM) too.
          # The attempt number keeps a re-run's branch from colliding.
          rescue="rescue/collect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          rescued=0
          keep() {
            [ "$rescued" = 1 ] && return 0
            rescued=1
            if git push origin "$ours:refs/heads/$rescue"; then
              echo "::error title=sweep not pushed::the day's collection is in commit $ours, pushed to branch $rescue; merge its rows by hand, or dispatch the slot again."
            else
              echo "::error title=sweep not pushed::branch $rescue could not be pushed either. The day's collection is in commit $ours on this runner only; dispatch the slot again."
            fi
          }
          trap keep ERR
          trap 'keep; exit 1' INT TERM
          # Another slot, or the nightly Routine (which commits data/paper.db
          # and data/learning.db), may have pushed while this one ran; rebase
          # our one data commit onto it rather than fail the push.
          # --autostash: the sweep leaves stores it did not stage (a cache file)
          # modified in the tree, and a rebase refuses to start over them.
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
            if git push; then
              exit 0
            fi
            # Rejected after a clean rebase: the branch moved again, or the
            # host failed. The loop below re-applies the commit on a fresh fetch.
            echo "push rejected after a clean rebase; re-applying on a fresh fetch"
          fi
          # The rebase stopped - on this repository that means a binary
          # conflict on a data/*.db both sides changed. This line used to be
          # `|| true`, which left the stopped rebase in place and let `git
          # push` fail quietly against a detached HEAD: the run went green and
          # the day's collection never reached main. Abort it, and re-apply
          # our commit on top of whatever is on the branch NOW. Not `-X
          # theirs`: every store is append-only, so taking either side whole
          # discards the other side's rows. A cherry-pick that applies cleanly
          # is the same commit rebased; one that conflicts is a real conflict,
          # and the retry is for the race where a third push lands between
          # our fetch and our push, not for wishing the conflict away.
          git rebase --abort 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # FETCH_HEAD is what that fetch brought, whatever refspec the
            # checkout configured. Whatever is not in $ours was never going to
            # be pushed.
            git reset --hard FETCH_HEAD
            if git cherry-pick "$ours"; then
              if git push; then
                exit 0
              fi
              echo "push rejected on attempt $attempt; the branch moved again"
              continue
            fi
            conflicted="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git cherry-pick --abort || true
            echo "::error title=data commit conflicts with ${GITHUB_REF_NAME}::attempt $attempt of 3: this run's commit $ours conflicts on: ${conflicted}"
          done
          # Gave up after 3 attempts. The stores are whole files plus parts;
          # re-applying the rescued commit is a merge of rows, by hand, not a
          # cherry-pick (docs/14, Large stores).
          keep
          exit 1

      # Exit 3 is "a source was degraded": part of the day was collected and
      # committed, and the sweep said which names and why. That is a warning
      # on the run, not a failed job - a job that is red every day GDELT
      # times out on one name trains the operator to ignore red, which is
      # the one thing this signal must never do. `ask.py watch` reads the
      # sweeps and pulls tables for the same fact. Exit 2 (could not run) and
      # an fx failure stay failures: nothing was collected, or the rate is
      # missing.
      - name: Warn if a source was degraded
        if: steps.sweep.outputs.code == '3'
        run: |
          echo "::warning title=sweep degraded::a source failed or was degraded; see the sweeps table in data/corpus.db and the pulls table in data/facts.db, or the summary above"

      - name: Fail if the sweep could not run
        if: (steps.sweep.outputs.code != '0' && steps.sweep.outputs.code != '3') || (steps.fx.outcome != 'skipped' && steps.fx.outputs.code != '0')
        run: |
          echo "sweep exited ${{ steps.sweep.outputs.code }}, fx exited ${{ steps.fx.outputs.code || 'n/a' }}"
          echo "  2 = could not run (config, slot or adapter)"
          exit 1

      # Not in the commit step, so that step can still push whatever else the
      # run collected: a corpus that was not split, or a store left out at 95
      # MiB, is a fault someone must see on the run, not a log line. Last, so
      # failing here cannot skip the degraded warning or the fx check above.
      - name: Fail if a store was not published
        if: steps.commit.outputs.split_failed == '1' || steps.commit.outputs.too_big == '1'
        run: |
          echo "split_failed=${{ steps.commit.outputs.split_failed }} too_big=${{ steps.commit.outputs.too_big }}"
          echo "see the commit step's annotations, and docs/14-OPERATIONS-RUNBOOK.md, Large stores"
          exit 1
