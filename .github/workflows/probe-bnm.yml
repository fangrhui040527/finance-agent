# TEMPORARY. Deleted before this branch merges.
#
# Round 1 found the feeds: bnm.gov.my is Liferay, and its feeds are
# AssetPublisher portlet resource URLs (p_p_resource_id=getRSS), which is why
# every guessed path 404s. Round 2 confirms they return XML, and whether the
# URL survives dropping the two ajax params.
name: probe-bnm

on:
  push:
    branches: ["claude/caveman-ultra-iet09k"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Do the linked feeds actually return XML
        run: |
          python3 - <<'PY'
          import re, urllib.error, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (compatible; finplanet-probe/0.1)"}
          BASE = "https://www.bnm.gov.my"
          PR = "com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_ZHckDJtILsio"

          FEEDS = {
            "press-release FULL (as linked)":
              f"{BASE}/press-release-2020?p_p_id={PR}&p_p_lifecycle=2&p_p_state=normal"
              f"&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage"
              f"&_{PR}_currentURL=%2Fpress-release-2020&_{PR}_portletAjaxable=true",
            "press-release MINIMAL (ajax params dropped)":
              f"{BASE}/press-release-2020?p_p_id={PR}&p_p_lifecycle=2&p_p_state=normal"
              f"&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage",
            "notices-announcements":
              f"{BASE}/notices-announcements?p_p_id=com_liferay_asset_publisher_web_portlet_"
              f"AssetPublisherPortlet_INSTANCE_XRQ5HftX94WW&p_p_lifecycle=2&p_p_state=normal"
              f"&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage",
            "speeches-interviews":
              f"{BASE}/speeches-interviews?p_p_id=com_liferay_asset_publisher_web_portlet_"
              f"AssetPublisherPortlet_INSTANCE_Jq1pQjJONpF7&p_p_lifecycle=2&p_p_state=normal"
              f"&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage",
          }

          for label, url in FEEDS.items():
              print("=" * 70)
              print(label)
              print(url)
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      ctype = r.headers.get("Content-Type", "")
                      body = r.read()
              except urllib.error.HTTPError as e:
                  print(f"  HTTP {e.code}")
                  continue
              except Exception as e:
                  print(f"  {type(e).__name__}: {e}")
                  continue

              text = body.decode("utf-8", "replace")
              is_xml = text.lstrip().startswith(("<?xml", "<rss", "<feed"))
              items = len(re.findall(r"<item[\s>]", text, re.I)) or len(
                  re.findall(r"<entry[\s>]", text, re.I))
              print(f"  HTTP 200  {ctype}  {len(body)} bytes  "
                    f"{'XML' if is_xml else 'NOT XML'}  items={items}")
              titles = re.findall(r"<title>(.*?)</title>", text, re.S | re.I)[:4]
              for t in titles:
                  t = re.sub(r"<!\[CDATA\[|\]\]>", "", t).strip().replace("\n", " ")
                  print(f"    - {t[:110]}")
              dates = re.findall(r"<pubDate>(.*?)</pubDate>", text, re.I)[:2]
              for d in dates:
                  print(f"    date: {d.strip()}")
          PY
