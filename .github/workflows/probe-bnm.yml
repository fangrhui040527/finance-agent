# TEMPORARY. Deleted before this branch merges.
#
# Round 2 found the linked press-release feed returns real XML - and that its
# items are from SEPTEMBER 2020. The page it hangs off is /press-release-2020,
# an ARCHIVE. The /rss landing page links the archive, not the live feed.
# Round 3 looks for the current listing page and the portlet id on it.
name: probe-bnm

on:
  push:
    branches: ["claude/caveman-ultra-iet09k"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Find the CURRENT press-release page and its feed
        run: |
          python3 - <<'PY'
          import re, urllib.error, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (compatible; finplanet-probe/0.1)"}
          BASE = "https://www.bnm.gov.my"

          PAGES = [
              "/press-release", "/press-releases", "/publications/press-release",
              "/announcements", "/notices-announcements", "/press-release-2026",
              "/press-release-2025", "/media-releases", "/news",
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.status, r.headers.get("Content-Type", ""), r.read()

          for path in PAGES:
              url = BASE + path
              try:
                  status, ctype, body = fetch(url)
              except urllib.error.HTTPError as e:
                  print(f"{e.code:>4}  {path}")
                  continue
              except Exception as e:
                  print(f"   -  {path}  {type(e).__name__}")
                  continue
              text = body.decode("utf-8", "replace")
              rss = sorted(set(re.findall(r'href="([^"]*getRSS[^"]*)"', text, re.I)))
              ids = sorted(set(re.findall(r'AssetPublisherPortlet_INSTANCE_([A-Za-z0-9]+)', text)))
              print(f"{status:>4}  {path:<28} {len(body):>7}b  getRSS_links={len(rss)}  portlet_ids={ids[:4]}")
              for r_ in rss:
                  print("        ", r_.replace("&amp;", "&")[:220])

          print("\n" + "=" * 70)
          print("Does the 2020 feed carry dates at all, and how fresh is item 1?")
          PR = "com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_ZHckDJtILsio"
          url = (f"{BASE}/press-release-2020?p_p_id={PR}&p_p_lifecycle=2&p_p_state=normal"
                 f"&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage")
          _, _, body = fetch(url)
          text = body.decode("utf-8", "replace")
          first = re.search(r"<item[\s>].*?</item>", text, re.S | re.I)
          print(first.group(0)[:900] if first else "no <item> found")
          PY
