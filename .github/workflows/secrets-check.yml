# Which secret and variable NAMES a workflow on this repository can see.
#
# Values are never printed: only the keys of the `secrets` and `vars`
# contexts, and a present/missing verdict for the names the collectors and
# probes expect. Run it when a probe reports "needs X_API_KEY, which is not
# set" after you believe you added it: an Environment secret (one scoped to
# a named deployment environment), a repository Variable, a Dependabot or
# Codespaces secret, or a misspelt name all look identical to "missing" from
# inside a job that does not declare an environment.
#
# Manual only; it touches no external service.
name: secrets-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Names visible to this job
        env:
          SECRET_JSON: ${{ toJSON(secrets) }}
          VAR_JSON: ${{ toJSON(vars) }}
        run: |
          {
            echo "## Names visible to workflows on this repository"
            echo
            echo "Repository secrets (plus the automatic GITHUB_TOKEN):"
            echo '```'
            jq -r 'keys[]' <<< "$SECRET_JSON"
            echo '```'
            echo
            echo "Repository variables:"
            echo '```'
            jq -r 'if length == 0 then "(none)" else keys[] end' <<< "$VAR_JSON"
            echo '```'
            echo
            echo "Expected by collect.yml, sources-probe.yml and free-backend-probe.yml:"
            echo
            missing=0
            for n in FINNHUB_API_KEY FMP_API_KEY ALPHAVANTAGE_API_KEY FRED_API_KEY GROQ_API_KEY; do
              if jq -e --arg n "$n" 'has($n)' <<< "$SECRET_JSON" >/dev/null; then
                echo "- $n: present"
              else
                echo "- $n: MISSING"
                missing=$((missing + 1))
              fi
            done
            echo
            if [ "$missing" -gt 0 ]; then
              echo "$missing missing. They must be Repository secrets: Settings > Secrets and variables > Actions > Repository secrets > New repository secret, with exactly these names. Environment secrets, Variables, Dependabot secrets and Codespaces secrets are not seen here."
            else
              echo "All five present."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
