# docs/07 done-ness criterion 10: the eval suite runs and a regression blocks
# promotion. The ratchet in core/registry/loader.py refuses to REGISTER a
# capability without a usable suite; this workflow is what makes that refusal
# happen on every push rather than only when someone runs it by hand.
#
# Runs on ubuntu AND windows. The dev machine is Windows; two tests failed there
# for weeks while this file only ever ran on Linux. That coverage is kept - see
# the matrix below for WHEN it runs.
#
# WHAT THIS COSTS, because it stopped being free. This is a private repository,
# so Actions bills against a monthly allowance and windows runners bill at TWICE
# the linux rate. On 2026-09-04 the allowance ran out mid-session and every job
# - collect included - began failing in under ten seconds with no runner. The
# daily sweep is not what spent it: that is about five linux minutes a day. CI
# was, and mostly on work it had already done:
#
#   * `branches: ["**"]` plus `pull_request` ran the FULL matrix twice on every
#     commit of every branch with a PR open - once for the push, once for the
#     pull_request event, on the same SHA. Half of every run was duplicate.
#   * windows was two thirds of the bill of each of those.
#
# So: pull requests get everything, because that is the gate that decides what
# reaches main. Pushes to main get a linux smoke check - the content was already
# tested as a PR. Branch pushes get nothing until a PR opens, which is when the
# result would first be worth reading.
#
# Second round, 2026-09-06, after the allowance ran out again on the 6th of the
# month (286 runs; both Actions budgets stood at $0 so every job died in two
# seconds). Two more spenders, measured from that month:
#
#   * every nightly `feedback:` and `paper:` push to main ran the linux matrix,
#     about 12 minutes a night, 700 a month, though no test reads those files.
#     The paths below skip them; docs stay in, because tests/test_docs_promises.py
#     pins the runbook and the status page.
#   * windows ran on both python versions per pull-request update, and windows
#     bills double. It now runs once, on 3.12; linux keeps both versions, and the
#     codec and path bugs windows exists to catch do not depend on the minor.
#
# Roughly 1,300 minutes a month less on that pattern, inside the 3,000 included.
name: ci

on:
  push:
    # main only. A branch push with a PR open is already covered by the
    # pull_request event below, and one without a PR open has no reader yet.
    branches: [main]
    paths-ignore:
      - "data/**"
      - "debug/**"
      - "knowledge/feedback/20*"
      - "knowledge/paper/20*"
  pull_request:
    paths-ignore:
      - "data/**"
      - "debug/**"
      - "knowledge/feedback/20*"
      - "knowledge/paper/20*"
  # A workflow you cannot fire by hand is a workflow you cannot recover. Added
  # after a push produced no run at all - not queued, not slow, no run object -
  # with no way to retry it short of an empty commit, which is worse than the
  # missing check it would paper over.
  workflow_dispatch:
    inputs:
      windows:
        description: "include the windows half of the matrix"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows on pull requests, where it guards what reaches main, and on
        # demand. NOT on every push to every branch, which is what it used to
        # mean and what made a windows-only bug cost four runs to find rather
        # than one. Dropping it here does not weaken the gate: nothing reaches
        # main without a pull request, and the pull request runs it.
        os: >-
          ${{ (github.event_name == 'pull_request' || inputs.windows)
              && fromJSON('["ubuntu-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
        python: ["3.11", "3.12"]
        # Windows once per update. Its job is the platform (codecs, paths, the
        # sqlite build), not the python minor; linux still runs both minors.
        exclude:
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --frozen: the lockfile is the contract. A resolver that drifts between
      # runs is a build that cannot be bisected.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # fail_under lives in pyproject [tool.coverage.report]; ratchet it there.
      - name: Tests with coverage gate
        run: uv run pytest -q --cov --cov-report=term

      # No network, no keys. If this needs either, the seam has leaked.
      - name: Verify pipeline on mock data
        run: uv run python verify.py

      # Adversarial, not a second happy path: volume, non-finite numbers, exact
      # thresholds, concurrent writers, hostile text. Exits with the finding count.
      - name: Stress
        run: uv run python stress/run.py

      - name: Eval ratchet
        run: |
          uv run python - <<'PY'
          from core.registry.loader import load
          reg = load("agents/registry.yaml")
          print(f"{len(reg.agents)} agents registered, {len(reg.knowledge)} knowledge stores")
          for spec in sorted(reg.agents.values(), key=lambda s: s.id):
              print(f"  {spec.id:22} {spec.eval_suite}")
          PY

      # The graph is built from checked-in sources with no network and no keys.
      # Built twice: a build that is not reproducible cannot have its diff
      # reviewed, and an unreviewable diff is how a bad edge lives for a year.
      # runner.temp, not /tmp: this job also runs on Windows.
      - name: Knowledge graph builds, twice, identically
        run: |
          uv run python -m knowledge.graph.build --db "${{ runner.temp }}/graph-a.db" --rebuild
          uv run python -m knowledge.graph.build --db "${{ runner.temp }}/graph-b.db" --rebuild
          uv run python -c "import sys;a,b=[open(p,'rb').read() for p in sys.argv[1:]];sys.exit(a!=b)" "${{ runner.temp }}/graph-a.db" "${{ runner.temp }}/graph-b.db"

      # The code graph is a maintainer's tool, but it parses every file in the
      # repository - so a build failure here is a syntax error somewhere, and
      # the reproducibility guarantee has to hold for it too, on every OS.
      - name: Codebase graph builds, twice, identically
        run: |
          uv run python -m knowledge.graph.build --code --db "${{ runner.temp }}/code-a.db" --rebuild
          uv run python -m knowledge.graph.build --code --db "${{ runner.temp }}/code-b.db" --rebuild
          uv run python -c "import sys;a,b=[open(p,'rb').read() for p in sys.argv[1:]];sys.exit(a!=b)" "${{ runner.temp }}/code-a.db" "${{ runner.temp }}/code-b.db"

      # The only end-to-end run that uses the REAL registry-derived allowlist.
      # verify.py and the unit tests pass hand-written allowlists with invented
      # agent ids, which is how a missing llm_complete grant survived unnoticed.
      - name: Traced full-system run
        run: uv run python trace_run.py

      # The MCP handshake, run against itself. If the server cannot complete
      # initialize -> tools/list -> tools/call offline, no client will fare better.
      - name: MCP server selftest
        run: uv run python -m mcp_server.server --selftest

      - name: Preflight doctor (offline)
        run: uv run python ask.py doctor --offline

      - name: No execution code anywhere
        run: uv run pytest tests/test_no_execution_anywhere.py -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Dependency vulnerability audit
        # pip-audit scans the installed ENVIRONMENT, which includes this project.
        # finance-agent is not published to PyPI, so it cannot be looked up, and
        # --strict promotes "could not be audited" from a warning to a failure -
        # which is why this job has been red on main since 2026-08-31 while every
        # test job passed. Auditing the exported lockfile with --no-emit-project
        # drops only the unpublishable local package.
        #
        # --strict is deliberately KEPT. A real dependency that cannot be audited
        # must still fail the build; dropping --strict also goes green but
        # silently weakens a security gate. --skip-editable looks like the fix
        # and is not - it still exits 1, with "distribution marked as editable".
        run: |
          uv export --frozen --quiet --no-emit-project --no-dev -o /tmp/reqs.txt
          uv run --frozen pip-audit --strict --desc -r /tmp/reqs.txt
