# docs/07 done-ness criterion 10: the eval suite runs and a regression blocks
# promotion. The ratchet in core/registry/loader.py refuses to REGISTER a
# capability without a usable suite; this workflow is what makes that refusal
# happen on every push rather than only when someone runs it by hand.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # A workflow you cannot fire by hand is a workflow you cannot recover. Added
  # after a push produced no run at all - not queued, not slow, no run object -
  # with no way to retry it short of an empty commit, which is worse than the
  # missing check it would paper over.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # No network, no keys. If this needs either, the seam has leaked.
      - name: Verify pipeline on mock data
        run: python verify.py

      # Adversarial, not a second happy path: volume, non-finite numbers, exact
      # thresholds, concurrent writers, hostile text. Exits with the finding count.
      - name: Stress
        run: python stress/run.py

      - name: Eval ratchet
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.registry.loader import load
          reg = load("agents/registry.yaml")
          print(f"{len(reg.agents)} agents registered, {len(reg.knowledge)} knowledge stores")
          for spec in sorted(reg.agents.values(), key=lambda s: s.id):
              print(f"  {spec.id:22} {spec.eval_suite}")
          PY

      # The graph is built from checked-in sources with no network and no keys.
      # Built twice: a build that is not reproducible cannot have its diff
      # reviewed, and an unreviewable diff is how a bad edge lives for a year.
      - name: Knowledge graph builds, twice, identically
        run: |
          python -m knowledge.graph.build --db /tmp/graph-a.db --rebuild
          python -m knowledge.graph.build --db /tmp/graph-b.db --rebuild
          cmp /tmp/graph-a.db /tmp/graph-b.db

      # The code graph is a maintainer's tool, but it parses every file in the
      # repository - so a build failure here is a syntax error somewhere, and
      # the reproducibility guarantee has to hold for it too.
      - name: Codebase graph builds, twice, identically
        run: |
          python -m knowledge.graph.build --code --db /tmp/code-a.db --rebuild
          python -m knowledge.graph.build --code --db /tmp/code-b.db --rebuild
          cmp /tmp/code-a.db /tmp/code-b.db

      # The only end-to-end run that uses the REAL registry-derived allowlist.
      # verify.py and the unit tests pass hand-written allowlists with invented
      # agent ids, which is how a missing llm_complete grant survived unnoticed.
      - name: Traced full-system run
        run: python trace_run.py

      # The MCP handshake, run against itself. If the server cannot complete
      # initialize -> tools/list -> tools/call offline, no client will fare better.
      - name: MCP server selftest
        run: python -m mcp_server.server --selftest

      - name: No execution code anywhere
        run: python -m pytest tests/test_no_execution_anywhere.py -q
