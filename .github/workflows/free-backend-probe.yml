# One real answer from every free provider that has a key, storing nothing.
#
# The development environment has no route to any model host, so the first
# proof that a free tier answers - the key works, the default model id still
# exists, the reply parses, the ledger prices it at zero - can only come from a
# runner. This is that runner. Run it after adding a free-provider key as a
# repository secret, and again when `ask.py` reports a 404 on a default model
# (free lineups rotate; docs/21 section 4).
#
# Manual only. Two calls per keyed provider on its cheapest model; it spends a
# few requests of a free quota and no money.
name: free-backend-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      FINPLANET_NO_DOTENV: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # One repository secret named ALL_SECRET holding every key is accepted:
      # .github/scripts/keys_from_blob.py finds each by label or shape, and this
      # step masks and exports it. A secret set under its own name wins.
      - name: Keys from ALL_SECRET, when the named secrets are not set
        env:
          ALL_SECRET: ${{ secrets.ALL_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$ALL_SECRET" ]; then
            echo "ALL_SECRET is not set; the named secrets are in use"
            exit 0
          fi
          python3 .github/scripts/keys_from_blob.py ALL_SECRET | while IFS='=' read -r name value; do
            if [ -n "${!name}" ]; then
              echo "$name: set under its own name; the blob's copy is ignored"
              continue
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name: taken from ALL_SECRET"
          done

      # Free lineups rotate: a default model id in the catalogue can retire
      # between one week and the next, and the backend then answers 404 with
      # the variable to set. This step prints the ids each keyed provider
      # serves today, nothing else, so the fix is a lookup rather than a guess.
      - name: Models each keyed provider serves today
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || env.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          list() {  # list <provider> <models url> <key>
            [ -z "$3" ] && return 0
            echo "### $1"
            echo '```'
            curl -sS --max-time 20 \
              -H "Authorization: Bearer $3" \
              -H "User-Agent: finplanet-analyst-mind/0.1 (personal research)" \
              "$2" | python3 -c 'import json,sys
            try:
                d = json.load(sys.stdin)
            except Exception as e:
                print(f"(not JSON: {e})"); sys.exit(0)
            rows = d.get("data") or d.get("models") or []
            ids = sorted(str(r.get("id") or r.get("name") or "") for r in rows if isinstance(r, dict))
            print("\n".join(i for i in ids if i) or "(no ids in the reply)")' | head -80
            echo '```'
          }
          {
            echo "## Models served today"
            echo
            list groq       "https://api.groq.com/openai/v1/models"        "$GROQ_API_KEY"
            list openrouter "https://openrouter.ai/api/v1/models"          "$OPENROUTER_API_KEY"
            list mistral    "https://api.mistral.ai/v1/models"             "$MISTRAL_API_KEY"
            list nvidia     "https://integrate.api.nvidia.com/v1/models"   "$NVIDIA_API_KEY"
            list gemini     "https://generativelanguage.googleapis.com/v1beta/openai/models" "$GEMINI_API_KEY"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Which backend would answer, and what the catalogue holds
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || env.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          {
            echo "## Backend selection"
            echo
            echo '```'
            uv run python ask.py backend || true
            echo
            uv run python ask.py backend --list
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: One word from each keyed provider
        env:
          QA_LIVE: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || env.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          uv run python -m pytest qa/phase2/test_p2_free_backend_live.py \
            -q -rs -o addopts= -p no:cacheprovider | tee live.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Live probe"
            echo
            echo '```'
            cat live.txt
            echo '```'
            if [ -f qa/artifacts/free-live.json ]; then
              echo
              echo "### What answered"
              echo
              echo '```json'
              cat qa/artifacts/free-live.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
