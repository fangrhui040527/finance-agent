version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tools:
        patterns: ["ruff", "pyright", "pytest*", "hypothesis", "pre-commit", "pip-audit"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
