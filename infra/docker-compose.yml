# P0 stack. Loopback-only binds and mandatory passwords: these stores hold
# portfolio data on a laptop; 0.0.0.0 with a default password is a lan-wide invite.
# `docker compose -f infra/docker-compose.yml up -d` then `make health`.
# docs/01 section 6: two hosts in production; one compose file in development.
name: finance-agent

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finplanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env - no default password}
      POSTGRES_DB: ${POSTGRES_DB:-finplanet}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finplanet}"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 5
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env - no default password}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4jdata:/data"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      retries: 5
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env - no default password}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio:latest
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-finplanet}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set in .env - no default password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  qdrantdata:
  neo4jdata:
  redisdata:
  miniodata:
