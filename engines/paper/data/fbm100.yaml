# The index book's universe: Bursa's FTSE Bursa Malaysia Top 100 (FBM100) -
# the 30 FBM KLCI names plus the 70 FBM Mid 70 names - after the June 2026
# semi-annual review (effective 2026-06-22).
#
# STILL NOT the official constituent list. Bursa publishes that as
# FBM100_Constituents_List_<Mon><YYYY>.pdf after each June and December review;
# no session has yet been able to open bursamalaysia.com or lseg.com. The list
# was first written from memory on 2026-09-25, then corrected on 2026-10-28 by
# replaying every published review change since June 2024 over it (the June
# 2024 KLCI list, the December 2024, June 2025, December 2025 and June 2026
# reviews, the March 2026 fast entry) - each change read from web-search
# extracts of the FTSE Russell / Bursa releases and the press reports quoting
# them, cited on the line it touched. Those reviews account for the 30 KLCI
# names exactly. The Mid 70 names no review since June 2024 touched are still
# from memory and unchecked, and the replay leaves MID70 one name short: at
# least one member that joined outside a review (Malaysia Airports' replacement
# after its February 2025 delisting is the likeliest) is not identified.
#
# The collector still checks each code against the company name Yahoo reports
# for it (`ask.py paper universe`) and the index book skips any name that does
# not match or has no price, so a wrong code costs a slot, never a wrong
# company's prices. Replace this list with the official one when it is to hand.
#
# `segment` is the sub-index each name sits in. Nothing reads it for weighting -
# the index book is equal-weight across all of them - it is here so a review can
# be applied one half at a time. `segments` says how many names each holds in
# this file; tests/test_paper_index.py holds the file to it.
#
# NEXT: the December 2026 review is the first of the KLCI enhancement, confirmed
# by FTSE Russell and Bursa Malaysia on 2026-08-20 (The Star, 2026-08-20 and
# 08-21; NST 2026-08; LSEG "FTSE Bursa Malaysia Index Series Enhancement FAQ",
# v1.1, August 2026 - read through search extracts, not opened):
#   - FBM KLCI goes from 30 to 50 constituents (about 60% -> 70% of Main Market
#     capitalisation); the 20 new names are selected on data as at 2026-11-23
#     and the final list is announced 2026-12-03.
#   - Phase 1, effective 2026-12-21: the 20 new constituents enter at half
#     their final weight. Phase 2, effective 2027-06-21: full weight.
#   - FBM Mid 70 goes from 70 to 50 and is renamed the FTSE Bursa Malaysia Mid
#     Cap Index (FBMMCAP). The FBM100 stays at 100 names (50 + 50).
# Weights do not matter here (equal weight), so only the membership of
# 2026-12-21 does: on that day 20 names move KLCI <- MID70, `segments` becomes
# {KLCI: 50, MID70: 50} (rename MID70 if wanted) and the FBM100 membership
# itself changes only by the review's own inclusions and exclusions. Nothing in
# the loader assumes 30. Do not apply any of it before the 2026-12-03 list.
#   https://www.thestar.com.my/business/business-news/2026/08/20/fbm-klci-to-expand-to-50-stocks-in-first-major-revamp-since-2009
