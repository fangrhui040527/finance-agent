agent: a10_thesis
cases:
  - name: full_evidence_accumulate
    agents_present: [a1_fundamentals, a2_valuation, a5_catalyst_events, a6_macro_regime]
    breakers: 3
    expect: accumulate
  - name: full_evidence_hold
    agents_present: [a1_fundamentals, a2_valuation, a5_catalyst_events, a6_macro_regime]
    breakers: 2
    expect: hold
  - name: negative_evidence_avoid
    agents_present: [a1_fundamentals, a2_valuation, a5_catalyst_events, a6_macro_regime]
    breakers: 2
    expect: avoid
  - name: staged_entry_on_unexplained_move
    unexplained_share: 0.85
    breakers: 2
    expect: hold
  # -- negatives -----------------------------------------------------------
  - name: no_breakers_no_stance
    agents_present: [a1_fundamentals, a2_valuation, a5_catalyst_events, a6_macro_regime]
    breakers: 0
    expect: no_view
    negative: true
    near_miss: true
  - name: missing_fundamentals_cannot_accumulate
    agents_present: [a2_valuation, a6_macro_regime]
    breakers: 3
    expect: no_view
    negative: true
    near_miss: true
  - name: one_breaker_is_not_two
    breakers: 1
    expect: no_view
    negative: true
