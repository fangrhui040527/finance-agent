# A5. Negatives: unconfirmed events are never citable, thin base rates never
# masquerade as evidence.
agent: a5_catalyst_events
cases:
  - name: classifies_earnings_beat
    expect: event
  - name: buckets_surprise
    actual: 0.42
    consensus: 0.31
    expect: event
  - name: base_rate_lookup_hits
    event_type: earnings_beat
    market: XKLS
    expect: base_rate
  - name: scores_six_factors
    expect: candidate
  - name: post_dated_event_penalised
    lag_sessions: -2
    expect: candidate
  # -- negatives -----------------------------------------------------------
  - name: unconfirmed_rumour_not_citable
    confirmed: false
    expect: refuse
    negative: true
    near_miss: true
  - name: thin_base_rate_carries_caveat
    n: 7
    expect: refuse
    negative: true
  - name: sector_wide_event_is_not_specific
    sector_wide: true
    expect: no_identified_catalyst
    negative: true
    near_miss: true
