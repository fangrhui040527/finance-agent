# A1. Negatives are point-in-time refusals: the figure was not knowable then.
agent: a1_fundamentals
cases:
  - name: reads_reported_line_item
    concept: net_income
    asof: 2025-06-30
    expect: line_item
  - name: flags_restated_figure
    concept: revenue
    restated: true
    expect: line_item
  - name: accrual_gap_flagged
    net_income: 500
    cash_from_operations: 120
    expect: quality_flag
  - name: healthy_cash_conversion
    net_income: 500
    cash_from_operations: 610
    expect: quality_flag
  - name: dupont_decomposes_roe
    expect: line_item
  # -- negatives -----------------------------------------------------------
  - name: not_yet_public_at_asof
    concept: net_income
    period_end: 2025-09-30
    asof: 2025-10-05
    expect: refuse
    negative: true
    near_miss: true
  - name: refuses_to_estimate_missing_line
    concept: segment_revenue
    available: false
    expect: refuse
    negative: true
