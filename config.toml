# FinPlanet Module 5 - user settings.
#
# Everything here is a DEFAULT you may change. The BOUNDS are not here, and are
# not changeable from a file: engines/risk/concentration.py refuses a single-name
# cap above 15% and an effective-bets floor below 3, whatever this file says.
# That is deliberate. A risk limit you can loosen by editing a config file is not
# a risk limit - it is a suggestion, and it gets loosened on exactly the day it
# would have saved you.
#
# Copy to config.local.toml to keep personal numbers out of git. The loader
# prefers config.local.toml when it exists.

[account]
# The currency everything is reported in. Foreign holdings are converted at an
# explicit rate with an as-of stamp; there is no implicit global rate.
base_currency = "MYR"

# Markets you actually trade. Adding one means an adapter class plus a registry
# entry (see docs/06 appendix); listing a MIC with no adapter is refused at load.
markets = ["XKLS", "XNAS"]

# Whose fee schedule this account actually pays. Unset means the VENUE's own
# schedule, which is what every adapter in markets/ ships - and markets/xnas.py
# ships a ZERO-COMMISSION US account: a 5 bps floor and a USD 1.00 minimum
# economic position. If that is not your account, sizing against it funds US
# positions that cannot pay for their own round trip, silently, because a wrong
# floor is still a number.
#
# "moomoo_my" is 0.03% commission + USD 0.99 flat per order + USD 0.003 a share,
# with the SEC and FINRA fees on the sale only. That is 204.9 bps round trip on a
# USD 100 position and moves the minimum economic position to about USD 1,511 at
# a USD 100 share price - roughly RM 6,270. It is per-share, so that minimum
# RISES as the share price falls: about USD 2,620 at USD 10 a share.
#
# A broker only replaces the venues it actually prices; anything else still
# sizes on the venue's terms, and the output names which was used.
broker = "moomoo_my"

# THE RATE, and nothing else: mid-market MYR per USD, 3 September 2026.
# `ask.py size --fetch-fx` replaces this for one run with BNM's dated rate;
# `ask.py fx` records that rate daily into data/fx.db, which is what the spread
# below is measured against.
#
# It used to be 4.15, which quietly bundled a 2.34% CARD markup into the rate.
# You convert through a broker, not a card. Bundling a cost into a rate shrank
# the portfolio on every US decision without ever naming the reason.
fx_myr_per_usd = 4.055

# What converting ringgit to dollars COSTS you, one way, as a fraction.
#
# NOT MEASURED, and the biggest unknown in this system. moomoo advertises
# "0 fees" on currency exchange and publishes no spread - the cost is inside
# the rate they hand you, and no page will tell you what it is. 0.5% is the
# upper end of independent estimates for a broker; a card is 2-3%.
#
# Why it matters more than everything above it: on a US position the entire
# fee schedule is about 0.3% round trip. A 0.5% spread each way is 1% round
# trip - more than three times every commission, platform fee, settlement fee,
# stamp duty and regulatory levy combined.
#
# TO MEASURE IT, and this no longer needs catching two numbers at one moment:
# the daily collector records BNM's official rate into data/fx.db. So convert a
# small amount whenever suits, note the rate the app actually gave you and the
# DATE, then:
#
#   python ask.py fx --show          # the official rate for that date
#
# The gap between the two, divided by the official rate, is this number.
fx_spread_per_side = 0.005

# What you actually own, and what you are considering. These are not decoration:
# the escalation gate (knowledge/news/features.py should_escalate) only lets an
# item through if it touches one of these names. With both empty NOTHING ever
# escalates, and a background sweep would run every night and surface nothing.
#
# Keep the watchlist SHORT. The gate exists so a person can read the output; a
# list long enough to fill a queue you stop reading is worse than no queue.
# Ids carry their market prefix and are validated at load - a typo here does not
# crash, it silently stops matching a name you think is being watched.
# A holding may be a bare id, or a table carrying what you own:
#   holdings = [{ id = "MYX:1155", units = 2000, avg_cost = 10.68, stop = 9.83, sector = "bank" }, { id = "MYX:1023", units = 2000, avg_cost = 7.96, stop = 7.32, sector = "telco" }, { id = "MYX:5296", units = 2000, avg_cost = 1.38, stop = 1.27, sector = "consumer" }, { id = "MYX:6012", units = 2000, avg_cost = 3.73, stop = 3.43, sector = "energy" }, { id = "MYX:4197", units = 2000, avg_cost = 2.60, stop = 2.39, sector = "plantation" }, { id = "MYX:1961", units = 2000, avg_cost = 4.68, stop = 4.31, sector = "reit" }]
# `stop` and `sector` are optional and only rebalancing uses them: without a
# stop the risk-budget cap cannot be computed for that name and the output says
# which cap it lost; without a sector the name counts as its own sector, which
# is how a book of six banks can look like six sectors.
# Without units the name is still watched and analysed; only the book value
# and anything that needs it (rebalancing) will say it cannot be computed.
holdings = []

# Nine names, and deliberately no more. Every one is in a DIFFERENT subsector
# per knowledge/graph/data/sectors.yaml - no two banks, no two chipmakers - so
# the queue is nine things to read rather than three things said nine times, and
# the concentration measures see nine bets instead of nine correlated ones.
#
#   MYX:1155 Maybank / Banks             MYX:8869 Press Metal / Aluminium
#   MYX:5347 Tenaga / Electric Utilities MYX:3182 Genting / Leisure and Gaming
#   MYX:5183 Petronas Chem / Chemicals   XNAS:NVDA NVIDIA / Semiconductors
#   MYX:5225 IHH / Hospitals             XNAS:AAPL Apple / Consumer Hardware
#                                        XNAS:MSFT Microsoft / Software
#
# Every id is already in knowledge/graph/data/entities.yaml. That is not
# optional: the sweep links a story to a name through that same table, so a
# company it does not list is one the news can never be matched to. Adding a
# name means adding its surface forms there first.
#
# Bursa carries the weight because it is the market that is actually affordable;
# the US names exercise the FX and US-fee paths, and a US position needs about
# USD 2,430 before sizing will agree to one at all.
#
# Kept on ONE line on purpose: tests/test_scope_and_context.py builds variant
# configs by substituting this line, and a multi-line array leaves the tail of
# the old value behind as broken TOML.
watchlist = ["MYX:1155", "MYX:5347", "MYX:5183", "MYX:5225", "MYX:8869", "MYX:3182", "XNAS:NVDA", "XNAS:AAPL", "XNAS:MSFT"]


[risk]
# Fraction of the portfolio you accept losing if a stop fills. 0.0075 = 0.75%.
# This bounds the LOSS, not the position - size is derived from it and the stop
# distance, never chosen first.
risk_per_trade = 0.0075

# Annualised volatility you are targeting. Realised vol above this scales the
# position down; below it does NOT scale up beyond the caps.
target_volatility = 0.20

# Maximum share of 20-day average daily value you are willing to be. Above ~5%
# your own order moves the price: at the cap, market impact (~224 bps) dwarfs
# fees (~23 bps on Bursa). Raising this is the least reversible setting here.
max_participation = 0.05


[limits]
# Concentration, measured four ways. Bounds enforced in code are noted.
single_name = 0.08            # hard ceiling 0.15, whatever this says
sector = 0.25
country = 0.40
non_base_currency = 0.50
correlation_cluster = 0.30
hhi = 0.18

# The measure that matters most, and the one a position count hides: ten
# correlated banks have a comfortable HHI and roughly one bet.
min_effective_bets = 5.0      # hard floor 3.0, whatever this says

# Sum of per-trade risk across every open position. The scenario that matters is
# not one stop filling; it is all of them filling in the same week.
portfolio_heat = 0.06
min_positions = 5


[capital]
# Your financial position. `engines/sizing/waterfall.py` turns this into
# investable capital, in this order, and the first three steps are LOCKED:
#
#   liquid assets
#     - emergency floor        (essential_monthly_spend x waterfall.emergency_months)
#     - near-term goals        (anything <= 24 months away)
#     - debt above the hurdle  (waterfall.debt_hurdle)
#     - one month of planned contributions, held as cash
#   = investable
#
# Leave these at zero and `ask.py size` cannot derive your capital - you would
# have to type it with --portfolio, which BYPASSES all three locks. That is
# supported and disclosed, never silent.
liquid_assets = 0.0
essential_monthly_spend = 0.0
planned_monthly_contribution = 0.0

# Money already spoken for. Inside 24 months it holds cash however good a
# signal looks: a goal you have to sell into a drawdown to fund is not funded.
#   goals = [{ name = "car deposit", amount = 30000, months_away = 18 }]
goals = []

# Debts. Anything above waterfall.debt_hurdle is repaid before equities.
# Write the rate as a fraction: 0.17 is 17%.
#   liabilities = [{ name = "credit card", balance = 4000, annual_rate = 0.17 }]
liabilities = []


[waterfall]
# Months of essential spending held before any of it is investable. Locked.
emergency_months = 6

# Debt above this annual rate is repaid before equities are bought. Paying down
# 17% card debt is a guaranteed 17% return; no equity thesis beats that.
debt_hurdle = 0.08


[budget]
# Refuse rather than cheapen: a question whose minimum honest plan costs more
# than this comes back as a refusal, not as a cheaper wrong answer.
daily_myr = 25.0
per_question_myr = 5.0

# Unattended work gets its own ceiling, kept separate from the interactive one
# above. Not a saving - a fault guard. A background job with a bug can spend all
# night making calls nobody asked for, and if it shares your budget you discover
# it when your own question is refused the next morning.
#
# Budgets are windowed over the last 24 hours, not lifetime.
daemon_daily_myr = 10.0


[provenance]
# Every model call: agent, task class, tier, tokens, cost, and the run that made
# it. Append-only, enforced by SQLite triggers rather than convention.
#
# This must be a real path for cost monitoring to be possible at all. It used to
# default to :memory: everywhere, so the ledger evaporated at process exit and
# docs/14's "compare cost monthly" had nothing to compare.
database = "data/provenance.db"


[learning]
# Where the prediction log lives. Gitignored. Never leaves the machine.
database = "data/learning.db"

# Graded calls before the calibration table means anything rather than measuring
# luck. Lowering this does not make you calibrated sooner.
min_graded_for_calibration = 30


[sources]
# Which feeds are live. Everything here is offline-safe: a disabled feed, or one
# whose key is missing, is skipped and says so. It never returns an empty list
# and lets you read that as a quiet news day.
#
# `ask.py sweep` reads this list. A name with no adapter is REFUSED at load -
# naming a source here does not create it, and an enabled name that ingests
# nothing every night is indistinguishable from a world in which nothing
# happened. (Until 2026-09-03 nothing read this block at all; see details/10.)
#
# The full world register - what exists, what it costs, what it needs a key for -
# is docs/world-sources.html.
# bnm_press is Bank Negara's press releases: the OPR decision, banking
# statistics, policy documents. It is MACRO news, not company news - it will
# rarely name Maybank or Tenaga, so expect most of it to arrive unlinked and
# be counted as such. That is still worth having on a book of Malaysian banks
# and utilities, which move on rate decisions; it is not a substitute for a
# Bursa company feed, which this system does not have yet.
#
# Added 2026-09-03 after GDELT returned nothing for any Bursa name over a
# 2-hour window. Whether that is GDELT's Malaysian coverage or the short window
# is still open - see details/09.
# bnm_press is registered and NOT enabled. Four sweeps on 2026-09-03/04 settled
# it: the endpoint shape is right and the CURRENT year's page has RSS switched
# off, so there is no live BNM feed to point at. The whole story is in
# knowledge/feeds/registry.py.
#
# Also worth remembering before anyone tries again: BNM is a central bank. Even
# working, it publishes rate decisions and banking statistics - macro news that
# will not name Maybank or Tenaga. It was never the fix for the missing Bursa
# COMPANY coverage; that still needs a Malaysian business news source.
#
# The register of every name here, what it needs and when it runs, is
# knowledge/sources/catalog.py (`python ask.py sources` prints it). Keyed
# sources skip themselves, with the variable named, until the key exists:
# FINNHUB_API_KEY, FMP_API_KEY, ALPHAVANTAGE_API_KEY, FRED_API_KEY.
#
# Malaysian business RSS candidates (thestar_business, edge_malaysia,
# bernama_business, fmt_business, nst_business) and bursa_announcements are
# registered and NOT enabled: their URLs were taken from published feed indexes
# and this project's development environment cannot fetch them. Run
# `python ask.py sources --probe` from a GitHub Actions runner (the
# sources-probe workflow), and enable each one whose probe shows dated items.
#
# PROBED TWICE FROM A RUNNER, 2026-09-04 and 2026-09-06, same answers both times:
#
#   thestar_business      404   the registered path no longer exists
#   edge_malaysia         404   ditto
#   nst_business          404   ditto
#   bernama_business      10 items, none dated - refused rather than ingested,
#                               because every one would enter the corpus stamped
#                               with the moment it was fetched
#   bnm_press             an HTML page advertising no feed
#   bursa_announcements   403 on every name, first request (knowledge/sources/bursa.py)
#
# A 404 now costs one extra request to the site root and the error names the
# feeds that page advertises, so the next probe can say where these went rather
# than only that they are gone. Until one of them answers with dated items, the
# Malaysian half of this book is covered by google_news and fmt_business alone.
enabled = [
  "gdelt", "google_news", "yahoo_rss",
  # The one Malaysian business feed that answered the probe on main (2026-09-04);
  # thestar/edge/nst returned 404, bernama undated, bnm_press HTML. Candidates.
  "fmt_business",
  "edgar", "bnm_opr", "dosm_cpi",
  "finnhub", "fmp", "alphavantage_news", "fred",
  # 2026-09-05, the four sites asked for by their free routes (details/09):
  # Jin10's public flash and calendar endpoints, DBnomics for the series behind
  # MacroMicro's charts, TWSE OpenAPI + FinMind for the Taiwan names Goodinfo
  # and 优分析 cover. Enabled for the first runner probe; what fails to answer
  # with dated rows comes off this list, as with the Malaysian feeds.
  # jin10_calendar came off it the same day: its CDN host is gone from DNS and
  # rili.jin10.com answers 404 on every documented path (see details/09). The
  # fred collector carries the US release calendar meanwhile.
  "jin10_flash", "dbnomics", "twse_openapi", "finmind",
  # Statement lines for the analyst engines (2026-09-06): the SEC's own XBRL
  # facts for the US names, keyless; EODHD behind an optional key, two names a
  # day on its free plan and US only until the Fundamentals plan.
  "sec_xbrl", "eodhd",
]

# Names the collectors read but the book never holds. TSMC is here as the
# NVDA supply-chain read (monthly revenue, P/E, foreign flows); moomoo MY does
# not trade Taiwan and the paper book never sees these ids. Must not repeat a
# holding or watchlist name.
read_only = ["XTAI:2330"]

# Languages an article may be in to be kept. GDELT's own names or ISO codes.
# Measured 2026-09-04: 38% of the corpus was Korean, Turkish, Spanish and
# twenty others, and not one of those articles linked to a Bursa name. Empty
# keeps everything.
languages = ["English", "Malay", "Chinese"]

# Where a sweep keeps what it saw. Append-only, deduplicated across runs, and
# carrying a row for every sweep INCLUDING the ones that failed - a month of
# refused requests and a genuinely quiet month leave the same empty article
# table otherwise, and only one of them means the world was quiet.
corpus_database = "data/corpus.db"

# The structured half: reported figures with the day they became knowable,
# dated events, macro series (vintaged), transcripts. Same append-only rules.
facts_database = "data/facts.db"

# GDELT DOC 2.0: free, no key, 100+ languages, worldwide. The API refuses a
# window under 15 minutes, and the adapter floors it there whatever you set.
gdelt_poll_minutes = 15

# Source languages to keep, by GDELT's own names. Empty means every language it
# monitors - which is the point of using it. Narrow this only if the volume is
# genuinely unusable.
gdelt_languages = []

# Source countries, ISO-style codes as GDELT spells them. Empty means worldwide.
gdelt_countries = []

# What to ASK GDELT for. Empty means "the names in holdings + watchlist", built
# from their surface forms in knowledge/graph/data/entities.yaml - the same
# table the linker matches on, so anything found can be attributed.
#
# Do not leave this empty AND the book empty. The adapter's own fallback is
# `domainis:reuters.com`, and on the first scheduled run that returned no
# articles at all. Set an explicit query here only to widen the net beyond the
# book - a general term like "Bursa Malaysia" - not to narrow it.
gdelt_query = ""

# moomoo OpenD, for daily bars across MY/HK/US/SG. QUOTES ONLY - this system has
# no broker connection and the price source imports no trade context.
#
# The gateway must be RUNNING and LOGGED IN. Since OpenD v10.10 the credentials
# left the config file, so login is manual after every reboot; there is no
# unattended start. Absent gateway = the source raises, never empty bars.
moomoo_enabled = false
moomoo_host = "127.0.0.1"
moomoo_port = 11111

[paper]
# The paper book (docs/22-PAPER-BOOK.md): a hypothetical USD ledger marked from
# the cached bars, with target weights recorded nightly inside these caps and
# a passive equal-lot control beside it. Nothing here can reach a broker; the
# module has no field for one. Every cap below is a ceiling or a floor the
# loader refuses to loosen (core/config.py HARD_BOUNDS): tighten freely.
start_date = 2026-09-08
initial_cash_usd = 1000
database = "data/paper.db"
# Conservative profile, agreed 2026-09-04.
max_weight_per_name = 0.25
# Applies once invested weight exceeds ramp_max_invested; below it the
# arithmetic minimum ceil(invested / max_weight_per_name) applies.
min_names_when_invested = 4
cash_floor = 0.20
# From average cost, in the name's own currency; exits at the next open.
stop_loss = 0.08
# From peak equity; past it no target may raise a weight.
drawdown_halt = 0.08
# Consideration changed over five weekdays, as a share of equity.
weekly_turnover_cap = 0.50
slippage_bps_xkls = 10
slippage_bps_xnas = 5
# Weeks 1-2 observe (logged, graded, never applied), weeks 3-6 ramp, then full.
observe_weeks = 2
ramp_weeks = 4
ramp_max_invested = 0.40
control_rebalance = "monthly"


[monitor]
# What `ask.py watch` alerts on. It records only state CHANGES, so a rule that
# stays tripped does not re-fire every run - an alert that repeats hourly is
# noise a person learns to ignore, which is worse than silence.
#
# Fraction of the daily budget that opens a spend alert.
spend_fraction = 0.8
# p95 latency over the last 24h, in milliseconds.
p95_latency_ms = 20000
# Share of claims dropped for want of a citation.
dropped_claim_rate = 0.2
# Hours of no model calls that counts as suspicious. 0 disables it: a personal
# tool is allowed to sit idle, but a SCHEDULED one that dies quietly looks
# exactly like a quiet week. Set this once something runs on a timer.
silence_hours = 0

# The same question asked of the SWEEP. `ask.py sweep` makes no model calls, so
# `silence_hours` above cannot see it: the ledger can be silent for a week while
# the sweep runs perfectly every morning, and busy with your questions while the
# sweep has been dead since Tuesday. 30 hours is a daily schedule plus six hours
# of slack, so one late run is not an alert and a missed day is.
#
# It stays quiet until a source has succeeded ONCE. A corpus that has never been
# filled is a system nobody has turned on, not a system that has stopped.
sweep_silence_hours = 30

# How many days of collector history to count missed SLOTS over.
#
# `sweep_silence_hours` above asks whether the collector STOPPED. It cannot see
# a collector that is merely unreliable, because it reads the newest success per
# source - so any run at all, including one fired by hand, resets it for every
# source at once. On 2026-09-07, checked at 14:20 UTC, neither the 09:20 nor the
# 12:30 slot had produced a run, a manual sweep at 08:50 had already reset the
# clock, and the alert list was clean: a day that had lost two of its three
# collections read as healthy. (The 09:20 slot arrived at 15:03, five hours and
# forty-three minutes late - which is the point, not a reprieve.)
#
# This counts instead. The cron owes a known number of firings over the window;
# the sweeps table says how many arrived. The TOTAL is what trips it, not any one
# slot - a bad day loses one firing from each of three slots, and a per-slot
# threshold would see three ones and say nothing. Three days is short enough to
# notice within a day and long enough that one late run crossing midnight is not
# an alert on its own (the rule also needs a shortfall of two).
#
# A sweep fired by hand is named in the alert but never counted as a scheduled
# run: it saves the data, not the schedule. Only firings recorded WITH a slot are
# counted, so rows collected before the column existed are never read as misses.
# 0 turns the rule off.
slot_window_days = 3

# Days over which every name in the book must have collected SOMETHING.
#
# The two rules above watch the COLLECTOR; this watches the BOOK. Both were
# green every day for a week while Petronas Chemicals held zero articles out of
# 1,673: it was searched only as "Petronas Chemicals" and never as "PCHEM", the
# form the Malaysian press prints, so every run succeeded and collected nothing
# about it. A per-name defect inside a working sweep is invisible to a rule that
# asks whether the sweep ran.
#
# It compares rather than thresholds: a name with no news is only evidence when
# OTHER names have news. If the whole book is empty the collector is down, which
# is sweep_silence's alert, and firing both would be two alerts about one fault.
#
# 14 days, because a Bursa mid-cap can genuinely have a quiet fortnight and a
# quiet month is not credible.
name_coverage_days = 14

# Drawdown from peak equity at which `ask.py watch` opens an alert on the paper
# book. 0.08 is the halt line itself: the alert and the halt fire together, so
# the person hears about the halt the same hour the book stops adding.
paper_drawdown = 0.08
