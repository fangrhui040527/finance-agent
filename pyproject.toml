[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.1.0"
description = "FinPlanet Module 5 - the Analyst Mind"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  # The model seam. Engines and tests never import it; EchoBackend keeps
  # everything offline. Lazy-imported inside AnthropicBackend only.
  "anthropic>=1.0,<2",
  # The web surface (web/). Loopback only; nothing else imports these.
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

# `pip install -e ".[dev]"` keeps working; uv reads [dependency-groups] below.
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["core*", "knowledge*", "markets*", "engines*", "agents*", "ui*", "mcp_server*"]

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:core", "error::DeprecationWarning:engines"]

# --- coverage ----------------------------------------------------------------
# Measured baseline on 2026-08-31: 94% over these packages. The gate sits two
# points under it and ratchets up, never down. Root scripts (ask.py, predict.py,
# verify.py, trace_run.py) are exercised through their own CI steps, not here.
[tool.coverage.run]
source = ["core", "engines", "markets", "agents", "knowledge", "mcp_server", "ui"]
omit = ["design/*", "stress/*", "qa/*", "debug/*", "tests/*", "*/__main__.py"]
branch = false

[tool.coverage.report]
fail_under = 92
skip_covered = true
show_missing = false

# --- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "debug", "qa", "design/*.dc.html", "finance_agent.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = [
  "E501",   # line length: enforced by the formatter, not the linter
  "B008",   # function calls in argument defaults (Decimal("0") is idiomatic here)
  "B905",   # zip() without strict= - Python 3.11 code, not worth churning every call
  "UP007",  # X | Y unions are already used where they matter; do not rewrite Optional in bulk
  "E741",   # `l` for a lesson/line is house style in 29 places; renaming is churn, not clarity
  "UP042",  # str-Enum classes serialise through .value on purpose; StrEnum would change repr
]

# print() is the CLI's output channel and the trace/stress scripts' report
# channel. It is FORBIDDEN in mcp_server/ (stdout is the JSON-RPC wire) and
# web/ (stderr logging only) - those two are simply absent from this list.
[tool.ruff.lint.per-file-ignores]
"ask.py" = ["T20"]
"predict.py" = ["T20"]
"verify.py" = ["T20"]
"trace_run.py" = ["T20"]
"stress/**" = ["T20"]
"tests/**" = ["T20"]
"design/**" = ["T20"]
"core/**" = ["T20"]
"agents/**" = ["T20"]
"engines/**" = ["T20"]
"markets/**" = ["T20"]
"knowledge/**" = ["T20"]
"ui/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["core", "engines", "markets", "agents", "knowledge", "mcp_server", "ui", "web", "stress", "tests"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --- pyright -----------------------------------------------------------------
[tool.pyright]
include = ["core", "engines", "markets", "agents", "mcp_server", "knowledge", "ui"]
exclude = ["**/__pycache__", ".venv", "debug", "qa"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingModuleSource = false
