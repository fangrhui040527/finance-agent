[project]
name = "finance-agent"
version = "0.1.0"
description = "FinPlanet Module 5 - the Analyst Mind"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["core*", "knowledge*", "markets*", "engines*", "agents*", "ui*", "mcp_server*"]
